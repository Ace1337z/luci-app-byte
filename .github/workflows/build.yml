name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify script syntax
        run: sh -n build.sh

      - name: Import signing key (if configured)
        env:
          BYTE_SIGNING_KEY: ${{ secrets.BYTE_SIGNING_KEY }}
        run: |
          if [ -n "$BYTE_SIGNING_KEY" ]; then
            mkdir -p .tools
            printf '%s' "$BYTE_SIGNING_KEY" | base64 -d > .tools/signing.key
            chmod 600 .tools/signing.key
          fi

      - name: Build packages (apk + ipk)
        run: |
          ./build.sh
          echo "== artifacts =="
          ls -l dist/

      - name: Verify apk signature (trusted, no --allow-untrusted)
        run: |
          rm -rf /tmp/apkverify
          mkdir -p /tmp/apkverify/etc/apk/keys
          cp dist/luci-app-byte-signing.pub /tmp/apkverify/etc/apk/keys/
          .tools/apk.static --root /tmp/apkverify verify dist/*.apk
          echo "apk verify OK (trusted ECDSA signature)"

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-byte-packages
          path: |
            dist/*.apk
            dist/*.ipk
            dist/*.pub

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: luci-app-byte-packages
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
